<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Codex Glance — your allowance, at a glance.</title>
  <desc id="desc">A minimal macOS menu bar showing Codex five-hour allowance at 68% remaining and weekly allowance at 84% remaining. Illustration with sample data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf5ef"/><stop offset="1" stop-color="#f8faf7"/></linearGradient>
    <linearGradient id="wall" x2="0.8" y2="1"><stop stop-color="#c4d9c9"/><stop offset="1" stop-color="#e3eade"/></linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#223d2e" flood-opacity="0.10"/></filter>
    <clipPath id="frame"><rect x="100" y="300" width="1000" height="204" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="100" y="64" width="106" height="28" rx="14" fill="#dbe9de"/>
    <text x="153" y="83" text-anchor="middle" fill="#345d43" font-size="11" font-weight="600" letter-spacing="1.3">MADE FOR MAC</text>
    <text x="98" y="170" fill="#16291e" font-size="67" font-weight="650" letter-spacing="-2.7">Codex Glance</text>
    <text x="102" y="216" fill="#4b6252" font-size="25" letter-spacing="-0.5">Your allowance, at a glance.</text>
    <g transform="translate(1007 124)" fill="none" stroke="#2d5139" stroke-width="3">
      <circle r="28"/><circle r="14" fill="#2d5139" stroke="none"/>
    </g>
    <g filter="url(#shadow)"><rect x="100" y="300" width="1000" height="204" rx="18" fill="url(#wall)"/></g>
    <g clip-path="url(#frame)">
      <path d="M100 490 Q355 310 600 490 T1100 490 V504 H100Z" fill="#afcbb7" opacity="0.40"/>
      <rect x="100" y="300" width="1000" height="46" fill="#fbfcfa" fill-opacity="0.92"/>
      <text x="126" y="329" fill="#29382d" font-size="19" font-weight="650">●</text>
      <text x="161" y="328" fill="#29382d" font-size="15" font-weight="600">Finder</text>
      <text x="230" y="328" fill="#48564b" font-size="14">File</text>
      <text x="268" y="328" fill="#48564b" font-size="14">Edit</text>
      <text x="308" y="328" fill="#48564b" font-size="14">View</text>
      <rect x="533" y="307" width="350" height="31" rx="7" fill="#e6eee7"/>
      <text x="550" y="329" fill="#1b3022" font-size="18" font-weight="600">Codex ◉ 5H 68%  |  W 84%</text>
      <g fill="none" stroke="#354b3b" stroke-width="1.7"><path d="M910 320q10-10 20 0m-16 4q6-6 12 0"/><circle cx="920" cy="328" r="1" fill="#354b3b"/><rect x="947" y="317" width="21" height="11" rx="2"/><path d="M970 320v5"/></g>
      <text x="988" y="328" fill="#354b3b" font-size="14">Tue 9:41</text>
    </g>
    <path d="M708 350 V400" stroke="#6f8e77" stroke-width="1"/>
    <circle cx="708" cy="350" r="3" fill="#6f8e77"/>
    <text x="708" y="426" text-anchor="middle" fill="#314d39" font-size="16" font-weight="500">5-hour + weekly · always visible</text>
    <text x="100" y="550" fill="#617768" font-size="13">Native Swift · macOS 13+ · Open source</text>
    <text x="1100" y="550" text-anchor="end" fill="#809185" font-size="11">Illustration · sample percentages</text>
  </g>
</svg>
